<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Direction matters</title>
  <desc id="d">Two sets of five equal efforts. On the left they point in many directions; chained tip to tail they end up almost where they started, so the net momentum, drawn in blue, is tiny. On the right they point in similar directions and the blue net momentum is long.</desc>
