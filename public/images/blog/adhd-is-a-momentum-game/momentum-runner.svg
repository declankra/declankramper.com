  <title id="t">Keep the momentum</title>
  <desc id="d">A dot runs along the ground. It jumps over grey blocks labelled notifications, overthinking, waiting for perfection, open loops and busy work. Each time it crosses a blue pad labelled taking action, a why, or commitment + accountability, it speeds up. A momentum bar at the top right grows with its speed.</desc>
